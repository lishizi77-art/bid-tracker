let filter = 'all', keyword = '';

function render() {
  const list = document.getElementById('list');
  let items = DATA.filter(r => {
    if (filter !== 'all' && !r.type.includes(filter)) return false;
    if (keyword) {
      const t = (r.hospital+r.product+r.supplier+r.preview).toLowerCase();
      if (!t.includes(keyword.toLowerCase())) return false;
    }
    return true;
  });
  document.getElementById('stats').textContent = `共 ${items.length} 条记录`;
  if (!items.length) {
    list.innerHTML = '<div class="empty"><div class="icon">🔍</div>没有找到匹配的记录</div>';
    return;
  }
  list.innerHTML = items.map((r,i) => {
    let badge = 'qt';
    if (r.type.includes('中标') || r.type.includes('成交') || r.type.includes('结果')) badge = 'jb';
    else if (r.type.includes('招标') || r.type.includes('采购')) badge = 'zb';
    return `<div class="card" onclick="showDetail(${i})">
      <div class="top">
        <span class="badge ${badge}">${r.type||'公告'}</span>
        <span class="date">${r.date||''}</span>
      </div>
      <div class="hospital">${r.hospital||'—'}</div>
      <div class="product">${r.product||''}</div>
      ${r.supplier?`<div class="supplier">👤 ${r.supplier}</div>`:''}
      ${r.amount?`<div class="amount">💰 ${r.amount}</div>`:''}
    </div>`;
  }).join('');
  window._filtered = items;
}

function showDetail(i) {
  const r = window._filtered[i];
  const c = document.getElementById('detailContent');
  c.innerHTML = `<h2>${r.hospital||'公告详情'}</h2>
    <div class="row"><div class="label">日期</div><div class="val">${r.date||'—'}</div></div>
    <div class="row"><div class="label">公告类型</div><div class="val">${r.type||'—'}</div></div>
    <div class="row"><div class="label">涉及产品</div><div class="val">${r.product||'—'}</div></div>
    <div class="row"><div class="label">中标/成交供应商</div><div class="val">${r.supplier||'—'}</div></div>
    <div class="row"><div class="label">中标金额</div><div class="val">${r.amount||'—'}</div></div>
    <div class="row"><div class="label">匹配关键词</div><div class="val">${r.keywords||'—'}</div></div>
    <div class="row"><div class="label">原文链接</div><div class="val"><a href="${r.url}" target="_blank">${r.url}</a></div></div>
    <div class="row"><div class="label">内容摘要</div><div class="val preview">${r.preview||'—'}</div></div>`;
  document.getElementById('detail').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}
function closeDetail(){
  document.getElementById('detail').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('overlay').onclick = closeDetail;
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  filter = t.dataset.f;
  render();
});
document.getElementById('search').oninput = e => { keyword = e.target.value; render(); };
render();
</script>
